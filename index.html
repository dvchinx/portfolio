<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- head:start -->
    <!-- Title, description, canonical, hreflang and Open Graph per language:
         src/lib/head.js, written here by scripts/prerender.js -->
    <title>Jesús Flórez</title>
    <!-- head:end -->

    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/portfolio/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9f8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..700&family=Mrs+Saint+Delafield&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Language: /portfolio/ is Spanish and /portfolio/en/ English (src/i18n).
      // Until the visitor picks one with the switch in the nav (saved under
      // "lang"), send them to the one their device asks for: the first Spanish
      // or English entry in the browser's languages. If neither is listed, use
      // the location: Spanish when the time zone belongs to a Spanish-speaking
      // country, English otherwise. Runs before the page paints; crawlers stay
      // on the URL they requested, which both pages list in hreflang.
      (function () {
        var spanishZones = /^(Europe\/Madrid|Africa\/(Ceuta|Malabo)|Atlantic\/Canary|Pacific\/(Easter|Galapagos)|America\/(Argentina\/.+|Buenos_Aires|Cordoba|Mendoza|Catamarca|Jujuy|Asuncion|Bahia_Banderas|Bogota|Cancun|Caracas|Chihuahua|Ciudad_Juarez|Costa_Rica|El_Salvador|Guatemala|Guayaquil|Havana|Hermosillo|La_Paz|Lima|Managua|Matamoros|Mazatlan|Merida|Mexico_City|Monterrey|Montevideo|Ojinaga|Panama|Puerto_Rico|Punta_Arenas|Santiago|Santo_Domingo|Tegucigalpa|Tijuana))$/;
        var current = /^\/portfolio\/en(\/|$)/.test(location.pathname) ? 'en' : 'es';
        var wanted = null;
        try { wanted = localStorage.getItem('lang'); } catch (e) {}
        if (wanted !== 'es' && wanted !== 'en') {
          wanted = null;
          if (/bot|crawl|spider|slurp|facebookexternalhit|headless|lighthouse/i.test(navigator.userAgent)) return;
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < langs.length && !wanted; i++) {
            var code = String(langs[i]).slice(0, 2).toLowerCase();
            if (code === 'es' || code === 'en') wanted = code;
          }
          if (!wanted) {
            var zone = '';
            try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
            wanted = spanishZones.test(zone) ? 'es' : 'en';
          }
        }
        if (wanted === current) return;
        document.documentElement.style.visibility = 'hidden';
        location.replace('/portfolio/' + (wanted === 'en' ? 'en/' : '') + location.search + location.hash);
      })();
    </script>
    <script>
      // The page is prerendered: hide what the entrance animations reveal
      // before it paints. The timeout shows it anyway if the app never loads.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion');
        setTimeout(() => document.documentElement.classList.remove('motion'), 4000);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
